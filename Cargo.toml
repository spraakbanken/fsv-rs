[package]
name = "fsv"
version = "0.1.0"
edition = "2024"

[lib]
name = "fsv"
path = "src/fsv.rs"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = { version = "0.1.44", features = ["log"] }
yaserde = { version = "0.12.0", features = ["derive"] }
